meta:
  name: 10x6_labyrinth
  description: 10x6 room with labyrinth profile
geometry:
  wall_pattern: wall|obstacle
  outflow_pattern: outlet|outflow
paths:
  mesh: geometry/labyrinth_2d_coarse.msh
  wind_csv: wind_gt.csv
  sample_dir: samples
  result_dir: results
wind_measurements:
  sample_sizes: [50, 100]
  add_gaussian_noise_std: 0.1
gt_wind_mapping:
  z_height: 0.025
  z_tol: 0.025
  max_xy_dist: 0.2
ns_solver_parameters:
  solver: WFNS
  regularization: gradient
  maxit: 25
  solver_tol: 0.01
  damping: 0.5
  viscosity: 1.0e-05
  weight_misfit: 10.0
  weight_pde_res: 1.0
  weight_reg: 1e-5
  weight_wfns_bc: 1.0
